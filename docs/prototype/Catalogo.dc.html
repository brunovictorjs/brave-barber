<main class="scr" style="height: 1300px;">
  <div class="body">
    <div class="topnav">
      <h1 class="ttl" style="margin: 0;">Catálogo</h1>
      <a class="ibtn" href="Carrinho.dc.html" aria-label="Carrinho, 2 itens"><svg class="ic" aria-hidden="true"><use href="#cart"></use></svg><span class="dot-n">2</span></a>
    </div>
    <nav class="segs" aria-label="O que você procura" style="margin-bottom: 14px;">
      <a class="on" href="Catalogo.dc.html" aria-current="page">Serviços</a>
      <a href="CatalogoProdutos.dc.html">Produtos</a>
    </nav>
    <label class="input" style="margin-bottom: 14px;">
      <svg class="ic-s" aria-hidden="true"><use href="#search"></use></svg>
      <input type="search" placeholder="Buscar corte, barba, cor…" aria-label="Buscar serviço" style="flex: 1; min-width: 0; height: 44px; background: transparent; border: 0; color: #f2f2f2; font: inherit; outline: none;">
    </label>
    <div class="scrollx" role="group" aria-label="Categorias" style="margin-bottom: 14px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}<sc-if value="{{c.count}}" hint-placeholder-val="{{false}}"><b>{{c.count}}</b></sc-if></button>
      </sc-for>
    </div>
    <div class="rowx xs muted" style="margin-bottom: 12px;"><span>{{total}}</span><span class="sp"></span><button class="rowx xs" style="gap: 5px; background: none; border: 0; color: #a6a6a6; cursor: pointer; padding: 0;">Mais procurados <svg class="ic-s" aria-hidden="true"><use href="#down"></use></svg></button></div>
    <div class="g2">
      <sc-for list="{{items}}" as="s" hint-placeholder-count="8">
        <div class="card flat" style="position: relative;">
          <a href="Servico.dc.html" style="display: block;">
            <div class="photo" style="height: 112px; border-radius: 0;"><svg class="ic-l" aria-hidden="true"><use href="{{s.icon}}"></use></svg>
              <sc-if value="{{s.tag}}" hint-placeholder-val="{{false}}"><span class="{{s.tagCls}}">{{s.tag}}</span></sc-if>
            </div>
            <div style="padding: 10px;">
              <div class="s b">{{s.name}}</div>
              <div class="xs muted" style="margin: 3px 0 7px;">{{s.meta}}</div>
              <div class="rowx" style="gap: 6px;"><span class="price">{{s.price}}</span><sc-if value="{{s.old}}" hint-placeholder-val="{{false}}"><span class="xs strike">{{s.old}}</span></sc-if><span class="sp"></span><span class="rate xs"><svg class="ic-s" aria-hidden="true" style="width: 12px; height: 12px;"><use href="#star"></use></svg>{{s.rate}}</span></div>
            </div>
          </a>
          <button class="ibtn" onClick="{{s.fav}}" aria-pressed="{{s.favPressed}}" aria-label="Favoritar {{s.name}}" style="position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; background: rgba(10,10,10,.75);"><svg class="ic-s" aria-hidden="true"><use href="{{s.heart}}"></use></svg></button>
        </div>
      </sc-for>
    </div>
    <div class="rowx" style="justify-content: center; gap: 6px; margin: 18px 0 4px;">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="2"><button class="{{p.cls}}" onClick="{{p.go}}" aria-current="{{p.cur}}" style="min-width: 36px; justify-content: center;">{{p.n}}</button></sc-for>
      <button class="chip" onClick="{{nextPage}}" aria-label="Próxima página" style="min-width: 36px; justify-content: center;">›</button>
    </div>
    <p class="xs muted center">{{loaded}}</p>
  </div>
  <nav class="tabbar" aria-label="Navegação principal">
    <a class="tab" href="Home.dc.html"><svg class="ic" aria-hidden="true"><use href="#home"></use></svg>Início</a>
    <a class="tab on" href="Catalogo.dc.html" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#scissor"></use></svg>Serviços</a>
    <a class="tab" href="MeusPedidos.dc.html"><svg class="ic" aria-hidden="true"><use href="#cal"></use></svg>Agenda</a>
    <a class="tab" href="PerfilCliente.dc.html"><svg class="ic" aria-hidden="true"><use href="#user"></use></svg>Perfil</a>
  </nav>
